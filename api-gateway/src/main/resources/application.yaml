spring:
  application:
    name: api-gateway

  main:
    banner-mode: off

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-public
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/sign-up, /api/v1/users/sign-in

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtAuthFilter

            - id: market-data-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/markets/**
              filters:
                - name: JwtAuthFilter

            - id: market-websocket
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: JwtAuthFilter

            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/portfolios/**
              filters:
                - name: JwtAuthFilter

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info
